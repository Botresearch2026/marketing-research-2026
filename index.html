<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Куда уходят маркетинговые бюджеты?</title>

<!-- Подключение шрифта из макета -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* 1. Общие цвета и базовые правила */
:root {
  --yellow: #f6e34b;
  --black: #080808;
  --grey: #777;
  --white: #fff;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--white);
}

body {
  color: var(--black);
  font-family: "Roboto Condensed", sans-serif;
  font-weight: 400;
}

button, textarea {
  font: inherit;
  color: inherit;
}

/* 2. Основной экран: занимает ширину окна, не сжимается в карточку */
.app {
  width: 100%;
  min-height: 100vh;
  min-height: 100svh;
  margin: auto;
  padding: clamp(28px, 5.3vw, 64px) clamp(24px, 5.4vw, 64px) 0;
  display: flex;
  flex-direction: column;
  background: var(--white);
  overflow-wrap: anywhere;
}

/* 3. Шапка с логотипами. SVG должны лежать рядом с index.html */
.header {
  width: 100%;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
  flex: 0 0 auto;
}

.logo-img {
  display: block;
  height: auto;
  object-fit: contain;
}

.logo-img.brif {
  width: clamp(132px, 26.7vw, 250px);
}

.logo-img.bd {
  width: clamp(112px, 24vw, 225px);
}

/* 4. Область вопроса и вертикальный отступ от логотипов */
#content {
  width: 100%;
  margin-top: clamp(120px, 11.8vh, 230px);
}

.question {
  margin: 0 0 clamp(42px, 5.2vw, 88px);
  max-width: 100%;
  font-size: clamp(32px, 5.1vw, 55px);
  font-weight: 400;
  line-height: 1.16;
  letter-spacing: 0;
}

.hint {
  margin: calc(clamp(42px, 5.2vw, 88px) * -0.72) 0 28px;
  color: var(--grey);
  font-size: clamp(16px, 1.9vw, 22px);
  line-height: 1.35;
}

.hint:empty {
  display: none;
}

/* 5. Ответы: вертикальный список, ширина капсулы зависит от текста */
.answers {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: clamp(10px, 1.3vw, 14px);
  width: 100%;
}

.answer {
  appearance: none;
  display: block;
  width: fit-content;
  max-width: 100%;
  min-height: clamp(60px, 10.6vw, 114px);
  padding: clamp(14px, 2.5vw, 28px) clamp(22px, 5.8vw, 62px);
  border: 2px solid var(--black);
  border-radius: 999px;
  background: var(--white);
  font-size: clamp(20px, 3.25vw, 35px);
  font-weight: 400;
  line-height: 1.25;
  text-align: left;
  cursor: pointer;
  transition: background-color 120ms ease, border-color 120ms ease;
}

/* Выбранный ответ выделяется жёлтым */
.answer.selected {
  background: var(--yellow);
  border-color: var(--yellow);
}

.answer:focus-visible,
.nav button:focus-visible {
  outline: 2px solid #2457ff;
  outline-offset: 4px;
}

/* 6. Поле для свободного текстового ответа */
.text-answer {
  display: block;
  width: min(100%, 720px);
  min-height: 150px;
  padding: 18px 20px;
  border: 2px solid var(--black);
  border-radius: 24px;
  background: var(--white);
  font-size: clamp(20px, 2.4vw, 28px);
  line-height: 1.4;
  resize: vertical;
}

.text-answer:focus {
  outline: 2px solid var(--black);
  outline-offset: 3px;
}

/* 7. Нижняя навигация: назад, номер шага, далее */
.footer {
  width: 100%;
  margin-top: auto;
  padding-top: clamp(100px, 13vh, 250px);
  padding-bottom: clamp(100px, 22vh, 430px);
}

.nav {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 16px;
  width: 100%;
}

.nav button {
  display: inline-flex;
  align-items: center;
  gap: clamp(8px, 1.4vw, 18px);
  width: fit-content;
  padding: 0;
  border: 0;
  background: transparent;
  font-size: clamp(24px, 4.2vw, 44px);
  font-weight: 400;
  line-height: 1.1;
  cursor: pointer;
}

.nav-label {
  text-decoration: underline;
  text-underline-offset: 4px;
}

#next {
  justify-self: end;
}

#back {
  justify-self: start;
}

.nav button:disabled {
  opacity: .25;
  cursor: default;
}

.progress {
  justify-self: center;
  color: var(--yellow);
  font-size: clamp(20px, 2.8vw, 30px);
  line-height: 1.2;
  white-space: nowrap;
}

/* 8. Демонстрационный блок статистики; реальные данные пока не подключены */
.stat-title {
  margin: 28px 0 8px;
  color: var(--grey);
  font-size: clamp(16px, 1.8vw, 20px);
}

.stat-number {
  margin: 0 0 6px;
  font-size: clamp(42px, 5vw, 58px);
  letter-spacing: -1px;
}

.stat-caption {
  color: var(--grey);
  font-size: clamp(16px, 1.8vw, 20px);
  line-height: 1.45;
}

.bar-list {
  display: grid;
  gap: 18px;
  width: min(100%, 720px);
  margin-top: 28px;
}

.bar-label {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 7px;
  font-size: clamp(15px, 1.7vw, 19px);
}

.bar-track {
  height: 6px;
  overflow: hidden;
  border-radius: 6px;
  background: #eee;
}

.bar-fill {
  height: 100%;
  background: var(--yellow);
}

/* 9. Адаптация для телефонов */
@media (max-width: 600px) {
  .app {
    padding: 24px 24px 0;
  }

  .header {
    gap: 16px;
  }

  .logo-img.brif {
    width: clamp(124px, 38vw, 170px);
  }

  .logo-img.bd {
    width: clamp(100px, 31vw, 145px);
  }

  #content {
    margin-top: clamp(100px, 13vh, 170px);
  }

  .question {
    margin-bottom: 42px;
    font-size: clamp(32px, 7.2vw, 42px);
    line-height: 1.18;
  }

  .hint {
    margin-top: -25px;
    margin-bottom: 22px;
    font-size: 16px;
  }

  .answers {
    gap: 10px;
  }

  .answer {
    min-height: 0;
    padding: 15px 24px;
    font-size: clamp(20px, 5.2vw, 25px);
    line-height: 1.25;
  }

  .footer {
    padding-top: 100px;
    padding-bottom: max(40px, 9vh);
  }

  .nav {
    gap: 8px;
  }

  .nav button {
    gap: 7px;
    font-size: clamp(22px, 5.7vw, 29px);
  }

  .progress {
    font-size: 22px;
  }

  .text-answer {
    min-height: 130px;
    padding: 14px;
    font-size: 20px;
  }
}

/* 10. Защита навигации от переполнения на очень узких экранах */
@media (max-width: 360px) {
  .app {
    padding-right: 16px;
    padding-left: 16px;
  }

  .nav button {
    font-size: 20px;
  }

  .progress {
    font-size: 18px;
  }
}

/* 11. Сокращение пустых промежутков на телефонах с коротким экраном */
@media (max-height: 760px) {
  #content {
    margin-top: clamp(60px, 8vh, 110px);
  }

  .footer {
    padding-top: 70px;
    padding-bottom: 40px;
  }
}
</style>
</head>

<body>
<!-- Главный контейнер опроса -->
<main class="app">

  <!-- Шапка с логотипами из файлов репозитория -->
  <header class="header">
    <img src="logo_brif.svg" alt="Чайный бриф" class="logo-img brif">
    <img src="logo_BD.svg" alt="B&D — исследование маркетинга" class="logo-img bd">
  </header>

  <!-- JavaScript подставляет сюда вопрос или экран статистики -->
  <section id="content" aria-live="polite"></section>

  <!-- Нижняя навигация -->
  <footer class="footer">
    <nav class="nav" aria-label="Навигация по опросу">
      <button id="back" type="button">
        <span aria-hidden="true">←</span>
        <span class="nav-label">назад</span>
      </button>

      <span class="progress" id="progress">1/5</span>

      <button id="next" type="button">
        <span class="nav-label">далее</span>
        <span aria-hidden="true">→</span>
      </button>
    </nav>
  </footer>
</main>

<script>
/* 12. Содержание опроса.
   Здесь можно менять вопросы и варианты.
   multi: true разрешает до трёх ответов; text: true создаёт текстовое поле. */
const questions = [
  {
    title: "Ваша должность?",
    hint: "",
    options: [
      "Директор по маркетингу / CMO",
      "Руководитель отдела маркетинга",
      "Маркетолог / руководитель направления",
      "Директор по коммуникациям",
      "Руководитель PR / PR-специалист",
      "Другое"
    ],
    multi: false
  },
  {
    title: "Как изменился маркетинговый бюджет за последний год?",
    hint: "Выберите один вариант ответа.",
    options: [
      "Значительно вырос",
      "Немного вырос",
      "Практически не изменился",
      "Немного сократился",
      "Значительно сократился",
      "Затрудняюсь ответить"
    ],
    multi: false
  },
  {
    title: "Что сильнее изменилось в вашей работе?",
    hint: "Можно выбрать до трёх вариантов.",
    options: [
      "Больше задач при тех же ресурсах",
      "Меньше ресурсов",
      "Больше требований к эффективности",
      "Сложнее согласовывать бюджеты",
      "Больше контроля руководства",
      "Больше аналитики и отчётности",
      "Больше срочных задач",
      "Практически ничего не изменилось"
    ],
    multi: true
  },
  {
    title: "Чего руководство чаще ждёт от маркетинга?",
    hint: "Можно выбрать до трёх вариантов.",
    options: [
      "Продаж и лидов",
      "Измеримого эффекта / ROI",
      "Узнаваемости бренда",
      "Удержания клиентов",
      "Экономии бюджета",
      "Более быстрого результата",
      "Использования ИИ и автоматизации",
      "Другое"
    ],
    multi: true
  },
  {
    title: "Если описать маркетинг в вашей компании в 2026 году одной фразой, то это…",
    hint: "Напишите коротко, как вы это видите.",
    text: true
  }
];

/* 13. Состояние опроса.
   Ответы хранятся в памяти страницы и не отправляются на сервер. */
const answers = {};
let index = 0;
let showingStats = false;

const content = document.getElementById("content");
const back = document.getElementById("back");
const next = document.getElementById("next");
const progress = document.getElementById("progress");

/* 14. Рисуем вопрос и восстанавливаем предыдущий ответ, если он есть */
function renderQuestion() {
  showingStats = false;
  const q = questions[index];

  let html = `<h1 class="question">${escapeHtml(q.title)}</h1>`;
  html += `<p class="hint">${escapeHtml(q.hint || "")}</p>`;

  if (q.text) {
    html += `<textarea class="text-answer" id="freeText" placeholder="Ваш ответ…" aria-label="Ваш ответ"></textarea>`;
  } else {
    html += `<div class="answers">`;

    q.options.forEach((option, i) => {
      const selected = (answers[index] || []).includes(option);

      html += `
        <button
          type="button"
          class="answer ${selected ? "selected" : ""}"
          data-option="${i}"
          aria-pressed="${selected}">
          ${escapeHtml(option)}
        </button>`;
    });

    html += `</div>`;
  }

  content.innerHTML = html;

  /* Восстанавливаем текстовый ответ после возвращения к вопросу */
  if (q.text) {
    const field = document.getElementById("freeText");
    field.value = answers[index] || "";

    field.addEventListener("input", event => {
      answers[index] = event.target.value;
    });
  } else {
    /* Обрабатываем нажатия на варианты ответа */
    content.querySelectorAll(".answer").forEach(button => {
      button.addEventListener("click", () => {
        const option = q.options[Number(button.dataset.option)];
        let selected = answers[index] || [];

        if (q.multi) {
          /* Для множественного выбора разрешено выбрать максимум три ответа */
          selected = selected.includes(option)
            ? selected.filter(item => item !== option)
            : selected.length < 3
              ? [...selected, option]
              : selected;
        } else {
          /* При одиночном выборе новый ответ заменяет предыдущий */
          selected = [option];
        }

        answers[index] = selected;
        renderQuestion();
      });
    });
  }

  updateNav();
}

/* 15. Демо-статистика.
   Это заглушка, а не настоящие результаты исследования. */
function renderStats() {
  showingStats = true;

  const q = questions[index];
  const selected = answers[index];
  const selectedText = Array.isArray(selected)
    ? selected.join(", ")
    : selected;

  let html = `
    <h1 class="question">А что ответили другие?</h1>
    <p class="hint">Демонстрационный пример статистики. Реальные данные появятся после подключения базы ответов.</p>
    <p class="stat-title">Уже ответили</p>
    <p class="stat-number">—</p>
    <p class="stat-caption">Пока статистика не подключена к ответам участников.</p>`;

  if (selectedText) {
    html += `<p class="stat-title">Ваш ответ</p><p>${escapeHtml(selectedText)}</p>`;
  }

  html += `<div class="bar-list">`;

  q.options?.slice(0, 5).forEach(option => {
    html += `
      <div>
        <div class="bar-label">
          <span>${escapeHtml(option)}</span>
          <span>—</span>
        </div>
        <div class="bar-track">
          <div class="bar-fill" style="width:0%"></div>
        </div>
      </div>`;
  });

  html += `</div>`;
  content.innerHTML = html;
  updateNav();
}

/* 16. Защита текста.
   Не позволяет ответам пользователя интерпретироваться как HTML-разметка. */
function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[character]));
}

/* 17. Обновляем навигацию и номер вопроса */
function updateNav() {
  back.disabled = index === 0 && !showingStats;
  next.disabled = false;

  next.innerHTML = showingStats && index === questions.length - 1
    ? '<span class="nav-label">завершить</span><span aria-hidden="true">→</span>'
    : '<span class="nav-label">далее</span><span aria-hidden="true">→</span>';

  progress.textContent = `${index + 1}/${questions.length}`;
}

/* 18. Кнопка «назад» */
back.addEventListener("click", () => {
  if (showingStats) {
    renderQuestion();
  } else if (index > 0) {
    index--;
    renderQuestion();
  }
});

/* 19. Кнопка «далее».
   Проверяет наличие ответа, показывает демо-статистику,
   переключает вопросы и выводит финальный экран. */
next.addEventListener("click", () => {
  if (!showingStats) {
    const answer = answers[index];

    const hasAnswer = Array.isArray(answer)
      ? answer.length > 0
      : typeof answer === "string"
        ? answer.trim().length > 0
        : Boolean(answer);

    if (!hasAnswer) {
      alert("Сначала ответьте на вопрос.");
      return;
    }

    renderStats();
  } else if (index < questions.length - 1) {
    index++;
    renderQuestion();
  } else {
    /* Финальный экран. Подключение базы и PDF пока не реализовано */
    content.innerHTML = `
      <h1 class="question">Спасибо за участие!</h1>
      <p class="stat-caption">Следующим этапом подключим финальные вопросы, согласия и получение полного PDF-отчёта.</p>`;

    back.disabled = true;
    next.disabled = true;
    progress.textContent = "готово";
  }
});

/* 20. При загрузке страницы показываем первый вопрос */
renderQuestion();
</script>
</body>
</html>
