<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Маркетинговое исследование</title>

<!-- Шрифт из макета Figma -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500&display=swap" rel="stylesheet">

<style>
/* 1. Базовые настройки и цвета */
:root {
  --ink: #080808;
  --paper: #ffffff;
  --accent: #f6e34b;
  --font: "Roboto Condensed", sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: var(--paper);
}

body {
  color: var(--ink);
  font-family: var(--font);
  font-weight: 400;
}

button,
textarea {
  font: inherit;
  color: inherit;
}

/* 2. Основной контейнер страницы */
.app {
  width: 100%;
  min-height: 100vh;
  min-height: 100svh;
  padding: 4.8vw 5.1vw 0;
  display: flex;
  flex-direction: column;
  background: var(--paper);
  overflow-wrap: break-word;
}

/* 3. Логотипы в верхней части страницы */
.header {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 20px;
  flex: 0 0 auto;
}

.logo-img {
  display: block;
  height: auto;
  object-fit: contain;
}

.logo-img.brif {
  width: 22.8%;
  max-width: 250px;
}

.logo-img.bd {
  width: 20.5%;
  max-width: 225px;
}

/* 4. Блок вопроса и отступ от логотипов */
#content {
  width: 100%;
  margin-top: 10.5vw;
}

.question {
  max-width: 100%;
  margin: 0 0 5.3vw;
  font-size: clamp(28px, 5.1vw, 55px);
  font-weight: 400;
  line-height: 1.43;
  letter-spacing: 0;
}

.hint {
  margin: -3.7vw 0 2.6vw;
  color: #666;
  font-size: clamp(15px, 2vw, 22px);
  line-height: 1.35;
}

.hint:empty {
  display: none;
}

/* 5. Список вариантов ответа */
.answers {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 10px;
  width: 100%;
}

/* Капсула ответа: ширина по тексту, без лишней минимальной высоты */
.answer {
  appearance: none;
  display: block;
  width: fit-content;
  max-width: 100%;
  min-height: 0;
  padding: 0.9em 1.7em;
  border: 2px solid var(--ink);
  border-radius: 134px;
  background: var(--paper);
  font-size: clamp(19px, 3.24vw, 35px);
  font-weight: 400;
  line-height: 1.43;
  text-align: left;
  cursor: pointer;
  transition: background-color 120ms ease, border-color 120ms ease;
}

/* Выбранный вариант ответа */
.answer.selected {
  background: var(--accent);
  border-color: var(--accent);
}

/* Видимая обводка при управлении с клавиатуры */
.answer:focus-visible,
.nav button:focus-visible {
  outline: 2px solid #2457ff;
  outline-offset: 4px;
}

/* 6. Поле для свободного текстового ответа */
.text-answer {
  display: block;
  width: min(100%, 720px);
  min-height: 130px;
  padding: 16px 18px;
  border: 2px solid var(--ink);
  border-radius: 24px;
  background: var(--paper);
  font-size: clamp(18px, 2.4vw, 26px);
  line-height: 1.4;
  resize: vertical;
}

.text-answer:focus {
  outline: 2px solid var(--ink);
  outline-offset: 3px;
}

/* 7. Нижняя панель навигации */
.footer {
  width: 100%;
  margin-top: auto;
  padding-top: 8vw;
  padding-bottom: 8.5vw;
}

.nav {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
  width: 100%;
}

.nav button {
  display: inline-flex;
  align-items: center;
  gap: 0.45em;
  width: fit-content;
  max-width: 100%;
  padding: 0;
  border: 0;
  background: transparent;
  font-size: clamp(22px, 4.05vw, 44px);
  font-weight: 400;
  line-height: 1.1;
  cursor: pointer;
  white-space: nowrap;
}

#back {
  justify-self: start;
}

#next {
  justify-self: end;
}

.nav-label {
  text-decoration: underline;
  text-underline-offset: 4px;
}

.nav button:disabled {
  opacity: 0.25;
  cursor: default;
}

/* Номер текущего шага */
.progress {
  justify-self: center;
  color: var(--accent);
  font-size: clamp(18px, 2.75vw, 30px);
  line-height: 1.2;
  white-space: nowrap;
}

/* 8. Экран демонстрационной статистики */
.stat-title {
  margin: 24px 0 8px;
  color: #666;
  font-size: clamp(15px, 1.8vw, 20px);
}

.stat-number {
  margin: 0 0 6px;
  font-size: clamp(40px, 5vw, 58px);
}

.stat-caption {
  color: #666;
  font-size: clamp(15px, 1.8vw, 20px);
  line-height: 1.45;
}

.bar-list {
  display: grid;
  gap: 16px;
  width: min(100%, 720px);
  margin-top: 24px;
}

.bar-label {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 7px;
  font-size: clamp(14px, 1.7vw, 19px);
}

.bar-track {
  height: 6px;
  overflow: hidden;
  border-radius: 6px;
  background: #eee;
}

.bar-fill {
  height: 100%;
  background: var(--accent);
}

/* 9. Адаптация для телефонов */
@media (max-width: 600px) {
  /* Боковые поля страницы */
  .app {
    padding: 6.2vw 5.5vw 0;
  }

  /* Размеры логотипов */
  .header {
    gap: 12px;
  }

  .logo-img.brif {
    width: 40%;
    max-width: 150px;
  }

  .logo-img.bd {
    width: 34%;
    max-width: 128px;
  }

  /* Расстояние от логотипов до вопроса */
  #content {
    margin-top: 18vw;
  }

  /* Заголовок на телефоне */
  .question {
    margin-bottom: 8.5vw;
    font-size: clamp(27px, 6.1vw, 36px);
    line-height: 1.3;
  }

  .hint {
    margin: -5.5vw 0 4vw;
    font-size: 15px;
  }

  /* Размеры списка и капсул ответов */
  .answers {
    gap: 8px;
  }

  .answer {
    padding: 0.62em 1.05em;
    border-width: 1.5px;
    border-radius: 999px;
    font-size: clamp(18px, 4.4vw, 25px);
    line-height: 1.3;
  }

  /* Нижняя навигация на телефоне */
  .footer {
    padding-top: 16vw;
    padding-bottom: 8vw;
  }

  .nav {
    gap: 6px;
  }

  .nav button {
    gap: 6px;
    font-size: clamp(19px, 5vw, 27px);
  }

  .progress {
    font-size: clamp(17px, 4vw, 22px);
  }

  .text-answer {
    min-height: 110px;
    padding: 12px;
    font-size: 18px;
  }
}

/* 10. Дополнительная адаптация для очень узких экранов */
@media (max-width: 360px) {
  .app {
    padding-right: 16px;
    padding-left: 16px;
  }

  .nav button {
    font-size: 18px;
  }

  .progress {
    font-size: 16px;
  }
}

/* 11. Коррекция отступов на невысоких экранах */
@media (max-height: 760px) {
  #content {
    margin-top: 7vw;
  }

  .footer {
    padding-top: 6vw;
    padding-bottom: 5vw;
  }
}
</style>
</head>

<body>
<!-- 12. Главный контейнер опроса -->
<main class="app">

  <!-- Верхняя строка с логотипами из репозитория -->
  <header class="header">
    <img src="logo_brif.svg" alt="Чайный бриф" class="logo-img brif">
    <img src="logo_BD.svg" alt="B&D — информационный партнёр" class="logo-img bd">
  </header>

  <!-- Здесь скрипт отображает вопрос или статистику -->
  <section id="content" aria-live="polite"></section>

  <!-- Нижняя панель навигации -->
  <footer class="footer">
    <nav class="nav" aria-label="Навигация по опросу">
      <button id="back" type="button">
        <span aria-hidden="true">←</span>
        <span class="nav-label">назад</span>
      </button>

      <span class="progress" id="progress">1/5</span>

      <button id="next" type="button">
        <span class="nav-label">далее</span>
        <span aria-hidden="true">→</span>
      </button>
    </nav>
  </footer>
</main>

<script>
/* 13. Список вопросов.
   Здесь можно редактировать формулировки и варианты ответов.
   multi: true — разрешено выбрать до трёх вариантов.
   text: true — отображается поле для свободного ответа. */
const questions = [
  {
    title: "Ваша должность?",
    hint: "",
    options: [
      "Директор по маркетингу / CMO",
      "Руководитель отдела маркетинга",
      "Маркетолог / руководитель направления",
      "Директор по коммуникациям",
      "Руководитель PR / PR-специалист",
      "Другое"
    ],
    multi: false
  },
  {
    title: "Как изменился маркетинговый бюджет за последний год?",
    hint: "Выберите один вариант ответа.",
    options: [
      "Значительно вырос",
      "Немного вырос",
      "Практически не изменился",
      "Немного сократился",
      "Значительно сократился",
      "Затрудняюсь ответить"
    ],
    multi: false
  },
  {
    title: "Что сильнее изменилось в вашей работе?",
    hint: "Можно выбрать до трёх вариантов.",
    options: [
      "Больше задач при тех же ресурсах",
      "Меньше ресурсов",
      "Больше требований к эффективности",
      "Сложнее согласовывать бюджеты",
      "Больше контроля руководства",
      "Больше аналитики и отчётности",
      "Больше срочных задач",
      "Практически ничего не изменилось"
    ],
    multi: true
  },
  {
    title: "Чего руководство чаще ждёт от маркетинга?",
    hint: "Можно выбрать до трёх вариантов.",
    options: [
      "Продаж и лидов",
      "Измеримого эффекта / ROI",
      "Узнаваемости бренда",
      "Удержания клиентов",
      "Экономии бюджета",
      "Более быстрого результата",
      "Использования ИИ и автоматизации",
      "Другое"
    ],
    multi: true
  },
  {
    title: "Если описать маркетинг в вашей компании в 2026 году одной фразой, то это…",
    hint: "Напишите коротко, как вы это видите.",
    text: true
  }
];

/* 14. Переменные состояния опроса.
   Ответы пока хранятся только в открытой странице,
   в базу данных они не отправляются. */
const answers = {};
let index = 0;
let showingStats = false;

const content = document.getElementById("content");
const back = document.getElementById("back");
const next = document.getElementById("next");
const progress = document.getElementById("progress");

/* 15. Отображение вопроса и вариантов ответа */
function renderQuestion() {
  showingStats = false;
  const q = questions[index];

  let html = `<h1 class="question">${escapeHtml(q.title)}</h1>`;
  html += `<p class="hint">${escapeHtml(q.hint || "")}</p>`;

  if (q.text) {
    html += `<textarea class="text-answer" id="freeText" placeholder="Ваш ответ…" aria-label="Ваш ответ"></textarea>`;
  } else {
    html += `<div class="answers">`;

    q.options.forEach((option, i) => {
      const selected = (answers[index] || []).includes(option);

      html += `
        <button
          type="button"
          class="answer ${selected ? "selected" : ""}"
          data-option="${i}"
          aria-pressed="${selected}">
          ${escapeHtml(option)}
        </button>`;
    });

    html += `</div>`;
  }

  content.innerHTML = html;

  /* Восстанавливаем свободный ответ после возврата к вопросу */
  if (q.text) {
    const field = document.getElementById("freeText");
    field.value = answers[index] || "";

    field.addEventListener("input", event => {
      answers[index] = event.target.value;
    });
  } else {
    /* Обрабатываем выбор варианта ответа */
    content.querySelectorAll(".answer").forEach(button => {
      button.addEventListener("click", () => {
        const option = q.options[Number(button.dataset.option)];
        let selected = answers[index] || [];

        if (q.multi) {
          /* Для множественного выбора ограничение — три варианта */
          if (selected.includes(option)) {
            selected = selected.filter(item => item !== option);
          } else if (selected.length < 3) {
            selected = [...selected, option];
          }
        } else {
          /* Для одиночного выбора сохраняется один вариант */
          selected = [option];
        }

        answers[index] = selected;
        renderQuestion();
      });
    });
  }

  updateNav();
}

/* 16. Экран демонстрационной статистики.
   Данные условные: реальные результаты ещё не подключены. */
function renderStats() {
  showingStats = true;

  const q = questions[index];
  const selected = answers[index];
  const selectedText = Array.isArray(selected)
    ? selected.join(", ")
    : selected;

  let html = `
    <h1 class="question">А что ответили другие?</h1>
    <p class="hint">Это демонстрационный экран. Реальные результаты появятся после подключения базы ответов.</p>
    <p class="stat-title">Уже ответили</p>
    <p class="stat-number">—</p>
    <p class="stat-caption">Статистика пока не подключена к ответам участников.</p>`;

  if (selectedText) {
    html += `<p class="stat-title">Ваш ответ</p><p>${escapeHtml(selectedText)}</p>`;
  }

  html += `<div class="bar-list">`;

  if (q.options) {
    q.options.slice(0, 5).forEach(option => {
      html += `
        <div>
          <div class="bar-label">
            <span>${escapeHtml(option)}</span>
            <span>—</span>
          </div>
          <div class="bar-track">
            <div class="bar-fill" style="width:0%"></div>
          </div>
        </div>`;
    });
  }

  html += `</div>`;
  content.innerHTML = html;

  updateNav();
}

/* 17. Экранирование текста, чтобы пользовательский ввод
   не интерпретировался браузером как HTML-разметка. */
function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[character]));
}

/* 18. Обновление номера шага и состояния кнопок */
function updateNav() {
  back.disabled = index === 0 && !showingStats;
  next.disabled = false;

  next.innerHTML = showingStats && index === questions.length - 1
    ? '<span class="nav-label">завершить</span><span aria-hidden="true">→</span>'
    : '<span class="nav-label">далее</span><span aria-hidden="true">→</span>';

  progress.textContent = `${index + 1}/${questions.length}`;
}

/* 19. Обработка кнопки «назад» */
back.addEventListener("click", () => {
  if (showingStats) {
    renderQuestion();
  } else if (index > 0) {
    index--;
    renderQuestion();
  }
});

/* 20. Обработка кнопки «далее».
   Проверяем заполнение ответа, показываем статистику,
   переходим к следующему вопросу или завершаем опрос. */
next.addEventListener("click", () => {
  if (!showingStats) {
    const answer = answers[index];

    const hasAnswer = Array.isArray(answer)
      ? answer.length > 0
      : typeof answer === "string"
        ? answer.trim().length > 0
        : Boolean(answer);

    if (!hasAnswer) {
      alert("Сначала ответьте на вопрос.");
      return;
    }

    renderStats();
  } else if (index < questions.length - 1) {
    index++;
    renderQuestion();
  } else {
    /* Финальный экран. Отправка ответов пока не реализована */
    content.innerHTML = `
      <h1 class="question">Спасибо за участие!</h1>
      <p class="stat-caption">Следующий этап — подключение финальных вопросов, согласий и выдачи PDF-отчёта.</p>`;

    back.disabled = true;
    next.disabled = true;
    progress.textContent = "готово";
  }
});

/* 21. Запускаем опрос с первого вопроса */
renderQuestion();
</script>
</body>
</html>
