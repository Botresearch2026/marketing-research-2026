
<!DOCTYPE html>
<html lang="ru">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Куда уходят маркетинговые бюджеты?</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --yellow: #f5e642;
  --black: #171717;
  --grey: #777;
  --line: #aaa;
  --white: #fff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #e8e8e8;
  color: var(--black);
  font-family: Arial, Helvetica, sans-serif;
}
.app {
  width: 100%;
  max-width: 430px;
  min-height: 100dvh;
  margin: auto;
  padding: 25px 24px 22px;
  background: var(--white);
  display: flex;
  flex-direction: column;
}
.header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 64px;
}
  .logo-img {
  display: block;
  height: auto;
  object-fit: contain;
}

.logo-img.brif {
  width: 132px;
}

.logo-img.bd {
  width: 105px;
}
.logo {
  font-family: Georgia, serif;
  font-size: 22px;
  font-weight: bold;
  line-height: .85;
  letter-spacing: -1px;
}
.brand {
  text-align: right;
  font-size: 10px;
  line-height: 1.2;
}
.question {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 30px;
  line-height: 1.15;
  font-weight: 700;
  margin: 0 0 20px;
  letter-spacing: -0.7px;
}
.hint {
  color: var(--grey);
  font-size: 12px;
  line-height: 1.4;
  margin: -16px 0 20px;
}
.answers {
  display: flex;
  flex-wrap: wrap;
  align-content: flex-start;
  gap: 8px 6px;
}
.answer {
  appearance: none;
  background: white;
  border: 1px solid var(--black);
  border-radius: 18px;
  padding: 12px 14px;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 16px;
  line-height: 1.25;
  text-align: left;
  cursor: pointer;
  max-width: 100%;
}
.answer.selected {
  background: var(--yellow);
  border-color: var(--yellow);
}
.answer:focus-visible, .nav button:focus-visible {
  outline: 2px solid #2457ff;
  outline-offset: 3px;
}
.text-answer {
  width: 100%;
  min-height: 130px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px;
  font: inherit;
  font-size: 14px;
  resize: vertical;
}
.footer {
  margin-top: auto;
  padding-top: 48px;
}
.nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.nav button {
  border: 0;
  background: none;
  padding: 8px 0;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 16px;
  line-height: 1.2;
  text-decoration: none;
  cursor: pointer;
  color: var(--black);
}
.nav button:disabled {
  opacity: .25;
  cursor: default;
}
.progress {
  color: #d5c72a;
  font-family: 'Roboto Condensed', sans-serif;
font-size: 35px;
line-height: 1.43;
}
.stat-title {
  font-size: 12px;
  color: var(--grey);
  margin: 28px 0 8px;
}
.stat-number {
  font-size: 48px;
  letter-spacing: -2px;
  margin: 0 0 6px;
}
.stat-caption {
  color: var(--grey);
  font-size: 12px;
  line-height: 1.5;
}
.bar-list {
  display: grid;
  gap: 17px;
  margin-top: 28px;
}
.bar-label {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-size: 12px;
  margin-bottom: 7px;
}
.bar-track {
  height: 5px;
  background: #eee;
  border-radius: 6px;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  background: var(--yellow);
}
@media (min-width: 600px) {
  body { padding: 24px 0; }
  .app {
    min-height: 820px;
    border: 1px solid #ddd;
  }
}
  @media (max-width: 599px) {
  .question {
    font-size: 36px;
    line-height: 1.2;
  }

  .answer {
    font-size: 23px;
    line-height: 1.25;
    padding: 10px 14px;
  }

  .nav button {
    font-size: 28px;
    line-height: 1.2;
  }

  .progress {
    font-size: 23px;
    line-height: 1.2;
  }
}
</style>
</head>
<body>
<main class="app">
  <header class="header">
   <img src="logo_brif.svg" alt="Чайный бриф" class="logo-img brif">
    <img src="logo_BD.svg" alt="B&D — исследование маркетинга" class="logo-img bd">
  </header>

  <section id="content" aria-live="polite"></section>

  <footer class="footer">
    <nav class="nav">
      <button id="back" type="button">← назад</button>
      <span class="progress" id="progress">1/5</span>
      <button id="next" type="button">далее →</button>
    </nav>
  </footer>
</main>

<script>
const questions = [
  {
    title: "Ваша должность?",
    hint: "Выберите один вариант ответа.",
    options: [
      "Директор по маркетингу / CMO",
      "Руководитель отдела маркетинга",
      "Маркетолог / руководитель направления",
      "Директор по коммуникациям",
      "Руководитель PR / PR-специалист",
      "Другое"
    ],
    multi: false
  },
  {
    title: "Как изменился маркетинговый бюджет за последний год?",
    hint: "Выберите один вариант ответа.",
    options: [
      "Значительно вырос", "Немного вырос",
      "Практически не изменился", "Немного сократился",
      "Значительно сократился", "Затрудняюсь ответить"
    ],
    multi: false
  },
  {
    title: "Что сильнее изменилось в вашей работе?",
    hint: "Можно выбрать до трёх вариантов.",
    options: [
      "Больше задач при тех же ресурсах",
      "Меньше ресурсов",
      "Больше требований к эффективности",
      "Сложнее согласовывать бюджеты",
      "Больше контроля руководства",
      "Больше аналитики и отчётности",
      "Больше срочных задач",
      "Практически ничего не изменилось"
    ],
    multi: true
  },
  {
    title: "Чего руководство чаще ждёт от маркетинга?",
    hint: "Можно выбрать до трёх вариантов.",
    options: [
      "Продаж и лидов", "Измеримого эффекта / ROI",
      "Узнаваемости бренда", "Удержания клиентов",
      "Экономии бюджета", "Более быстрого результата",
      "Использования ИИ и автоматизации", "Другое"
    ],
    multi: true
  },
  {
    title: "Если описать маркетинг в вашей компании в 2026 году одной фразой, то это…",
    hint: "Напишите коротко, как вы это видите.",
    text: true
  }
];

const demoStats = [34, 22, 18, 14, 12];
const answers = {};
let index = 0;
let showingStats = false;

const content = document.getElementById("content");
const back = document.getElementById("back");
const next = document.getElementById("next");
const progress = document.getElementById("progress");

function renderQuestion() {
  showingStats = false;
  const q = questions[index];
  let html = `<h1 class="question">${q.title}</h1>`;
  html += `<p class="hint">${q.hint || ""}</p>`;

  if (q.text) {
    html += `<textarea class="text-answer" id="freeText" placeholder="Ваш ответ…"></textarea>`;
  } else {
    html += `<div class="answers">`;
    q.options.forEach((option, i) => {
      const selected = (answers[index] || []).includes(option);
      html += `<button type="button" class="answer ${selected ? "selected" : ""}" data-option="${i}" aria-pressed="${selected}">${option}</button>`;
    });
    html += `</div>`;
  }

  content.innerHTML = html;

  if (q.text) {
    document.getElementById("freeText").value = answers[index] || "";
    document.getElementById("freeText").addEventListener("input", e => {
      answers[index] = e.target.value;
    });
  } else {
    content.querySelectorAll(".answer").forEach(button => {
      button.addEventListener("click", () => {
        const option = q.options[Number(button.dataset.option)];
        let selected = answers[index] || [];
        if (q.multi) {
          selected = selected.includes(option)
            ? selected.filter(x => x !== option)
            : selected.length < 3 ? [...selected, option] : selected;
        } else {
          selected = [option];
        }
        answers[index] = selected;
        renderQuestion();
      });
    });
  }
  updateNav();
}

function renderStats() {
  showingStats = true;
  const q = questions[index];
  const selected = answers[index];
  const selectedText = Array.isArray(selected) ? selected.join(", ") : selected;
  let html = `<h1 class="question">А что ответили другие?</h1>
    <p class="hint">Демонстрационный пример статистики. Реальные данные появятся после подключения базы ответов.</p>
    <p class="stat-title">Уже ответили</p>
    <p class="stat-number">—</p>
    <p class="stat-caption">Пока статистика не подключена к ответам участников.</p>`;

  if (selectedText) {
    html += `<p class="stat-title">Ваш ответ</p><p>${escapeHtml(selectedText)}</p>`;
  }
  html += `<div class="bar-list">`;
  q.options?.slice(0, 5).forEach((option, i) => {
    html += `<div>
      <div class="bar-label"><span>${option}</span><span>—</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:0%"></div></div>
    </div>`;
  });
  html += `</div>`;
  content.innerHTML = html;
  updateNav();
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[c]));
}

function updateNav() {
  back.disabled = index === 0 && !showingStats;
  next.textContent = index === questions.length - 1 && showingStats ? "завершить →"
    : showingStats ? "далее →" : "далее →";
  progress.textContent = `${index + 1}/${questions.length}`;
}

back.addEventListener("click", () => {
  if (showingStats) renderQuestion();
  else if (index > 0) {
    index--;
    renderQuestion();
  }
});

next.addEventListener("click", () => {
  if (!showingStats) {
    if (!answers[index] || (Array.isArray(answers[index]) && answers[index].length === 0)) {
      alert("Сначала ответьте на вопрос.");
      return;
    }
    renderStats();
  } else if (index < questions.length - 1) {
    index++;
    renderQuestion();
  } else {
    content.innerHTML = `<h1 class="question">Спасибо за участие!</h1>
      <p class="stat-caption">Следующим этапом подключим финальные вопросы, согласия и получение полного PDF-отчёта.</p>`;
    back.disabled = true;
    next.disabled = true;
    progress.textContent = "готово";
  }
});

renderQuestion();
</script>
</body>
</html>
